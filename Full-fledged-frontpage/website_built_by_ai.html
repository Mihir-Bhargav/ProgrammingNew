<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizza Paradise</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8f8f8;
      }
      header {
        background: #d62828;
        color: white;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header nav a {
        color: white;
        margin: 0 10px;
        text-decoration: none;
        font-weight: bold;
      }
      header nav a:hover {
        text-decoration: underline;
      }
      #container {
        display: flex;
      }
      #sidebar {
        background: #ffb703;
        width: 200px;
        padding: 15px;
        height: calc(100vh - 60px);
      }
      #sidebar h3 {
        margin-top: 0;
      }
      #sidebar a {
        display: block;
        margin: 8px 0;
        text-decoration: none;
        color: black;
        font-weight: bold;
      }
      #main {
        flex: 1;
        padding: 20px;
      }
      .pizza {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin: 10px;
        display: inline-block;
        width: 200px;
        box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .pizza img {
        max-width: 100%;
        border-radius: 8px;
      }
      button {
        background: #d62828;
        color: white;
        padding: 8px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
      }
      button:hover {
        background: #a4161a;
      }
      #cart {
        background: white;
        padding: 15px;
        position: fixed;
        right: 20px;
        bottom: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1);
        width: 250px;
      }
      #cart h3 {
        margin-top: 0;
      }
      #login {
        display: none;
        padding: 20px;
        max-width: 300px;
        margin: auto;
        background: white;
        border-radius: 8px;
        margin-top: 50px;
      }
      input {
        width: 100%;
        padding: 8px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🍕 Pizza Paradise</h1>
      <nav>
        <a href="#">Veg Options</a>
        <a href="#">Offers</a>
        <a href="#">Thin Crust</a>
        <a href="#">Thick Crust</a>
        <a href="#" onclick="showLogin()">Login</a>
      </nav>
    </header>

    <div id="container">
      <div id="sidebar">
        <h3>Menu</h3>
        <a href="#">All Pizzas</a>
        <a href="#">Veg Pizzas</a>
        <a href="#">Non-Veg Pizzas</a>
        <a href="#">Special Deals</a>
      </div>

      <div id="main">
        <div class="pizza">
          <img src="https://via.placeholder.com/150" alt="Pizza" />
          <h4>Margherita</h4>
          <p>Classic cheese & tomato</p>
          <p>$8</p>
          <button onclick="addToCart('Margherita', 8)">Add to Cart</button>
        </div>
        <div class="pizza">
          <img src="https://via.placeholder.com/150" alt="Pizza" />
          <h4>Pepperoni</h4>
          <p>Spicy pepperoni & cheese</p>
          <p>$10</p>
          <button onclick="addToCart('Pepperoni', 10)">Add to Cart</button>
        </div>
        <div class="pizza">
          <img src="https://via.placeholder.com/150" alt="Pizza" />
          <h4>Veggie Delight</h4>
          <p>Loaded with fresh veggies</p>
          <p>$9</p>
          <button onclick="addToCart('Veggie Delight', 9)">Add to Cart</button>
        </div>
      </div>
    </div>

    <div id="cart">
      <h3>Cart</h3>
      <ul id="cartItems"></ul>
      <strong>Total: $<span id="cartTotal">0</span></strong>
    </div>

    <div id="login">
      <h2>Login</h2>
      <input type="text" placeholder="Username" id="username" />
      <input type="password" placeholder="Password" id="password" />
      <button onclick="login()">Login</button>
    </div>

    <script>
      let cart = [];
      let total = 0;

      function addToCart(name, price) {
        cart.push({ name, price });
        total += price;
        updateCart();
      }

      function updateCart() {
        const cartItems = document.getElementById("cartItems");
        cartItems.innerHTML = "";
        cart.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = `${item.name} - $${item.price}`;
          cartItems.appendChild(li);
        });
        document.getElementById("cartTotal").textContent = total;
      }

      function showLogin() {
        document.getElementById("main").style.display = "none";
        document.getElementById("sidebar").style.display = "none";
        document.getElementById("login").style.display = "block";
      }

      function login() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (user && pass) {
          alert(`Welcome, ${user}!`);
          document.getElementById("login").style.display = "none";
          document.getElementById("main").style.display = "block";
          document.getElementById("sidebar").style.display = "block";
        } else {
          alert("Please enter username and password.");
        }
      }
    </script>
  </body>
</html>
